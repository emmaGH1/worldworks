[package]
name = "ww-chainsig-probe"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
omni-transaction = { version = "=0.5.0", default-features = false, features = ["evm"] }
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
