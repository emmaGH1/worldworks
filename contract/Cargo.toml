[package]
name = "worldworks-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "~5.28.0", features = ["legacy"] }
worldworks-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "~5.28.0", features = ["non-contract-usage"] }
near-workspaces = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
